{% extends "donor/dashboard.html" %}
{% block body %}
<p class="mb-1 pt-2 text-bold">View Payment Details</p>
<body>
    <form action="" method="POST">
        <table class="table align-items-center justify-content-center mb-0">


            <tr>
                <th>
                    Sl no :
                </th>
                <th>
                    Amount :
                </th>

                <th>
                    Date :
                </th>

                   <th>
                    Time :
                </th>

            </tr>

            {% for i in data %}
            <tr>

                <td>
                    {{ loop.index }}
                </td>
                <td>
                    {{ i["amount"] }}
                </td>

             <td>
                    {{ i["date"] }}
                </td>
             <td>
                    {{ i["time"] }}
                </td>







            </tr>
            {% endfor %}

        </table>
    </form>
</body>
{%endblock%}

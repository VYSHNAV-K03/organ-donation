{% extends "signdashboard.html" %}
{% block body %}
{#<p class="mb-1 pt-2 text-bold">Add Manage Organ</p>#}

<body>
    <form action="" method="POST" enctype="multipart/form-data">
        <table class="table align-items-center justify-content-center mb-0">

            <tr>
                <td>
                    Donor Name :
                </td>
                <td>
                    <input type="text" name="name" placeholder="Enter  name" required class="form-control">
                </td>
            </tr>

            <tr>
                <td>
                    Place :
                </td>
                <td>
                    <input type="text" name="place" placeholder="Enter  place" required class="form-control">
                </td>
            </tr>


            <tr>
                <td>
                    Post :
                </td>
                <td>
                    <input type="text" name="post" placeholder="Enter  Post" required class="form-control">
                </td>
            </tr>


            <tr>
                <td>
                    Pin :
                </td>
                <td>
                    <input type="text" name="pin" placeholder="Enter  Pin" required class="form-control"> <!-- pattern="[6][0-9]{6}" -->
                </td>
            </tr>




            <tr>
                <td>
                    Age :
                </td>
                <td>
                    <input type="text" name="age" placeholder="Enter  age" required class="form-control">
                </td>
            </tr>



            <tr>
                <td>
                    Gender :
                </td>
                <td>
                    <input type="text" name="gender" placeholder="Enter  gender" required class="form-control">
                </td>
            </tr>

            <tr>
                <td>
                    Email :
                </td>
                <td>
                    <input type="email" name="email" placeholder="Enter Email" required class="form-control">
                </td>
            </tr>

            <tr>
                <td>
                    Phone :
                </td>
                <td>
                    <input type="text" name="phone" placeholder="Enter  Phone" required class="form-control" pattern="[9876]0-9]{9}">
                </td>
            </tr>


            <tr>
                <td>
                    Password :
                </td>
                <td>
                    <input type="password" name="pass" placeholder="Enter  Password" class="form-control">
                </td>
            </tr>



            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Register" class="btn btn-primary">
                </td>
            </tr>

        </table>
    </form>

</body>
{%endblock%}

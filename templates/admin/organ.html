{% extends "dashboard.html" %}
{% block body %}
<p class="mb-1 pt-2 text-bold">Add hair</p>

<body>
    <form action="" method="POST" enctype="multipart/form-data">
        <table class="table align-items-center justify-content-center mb-0">

            <tr>
                <td>
                    Hair type :
                </td>
                <td>
                    <input type="text" name="hair type" placeholder="Enter hair type" class="form-control">
                </td>
            </tr>

            <tr>
                <td>
                    Description :
                </td>
                <td>
                    <input type="text" name="des" placeholder="Enter the description" class="form-control">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Add" class="btn btn-primary">
                </td>
            </tr>

        </table>
    </form>

<br>

        <table class="table align-items-center justify-content-center mb-0">


            <tr>
                <th>
                    Sl no :
                </th>
                <th>
                    hairtype:
                </th>

                <th>
                    Description :
                </th>




                <th></th>
            </tr>

            {% for i in data %}
            <tr>

                <td>
                    {{ loop.index }}
                </td>
                <td>
                    {{ i["organ"] }}
                </td>

             <td>
                    {{ i["description"] }}
                </td>



                <td>
                    <br>


                    <a href="/delete_organ?id={{ i["id"] }}" class="btn btn-danger">Delete</a>

                </td>
            </tr>
            {% endfor %}

        </table>

</body>
{%endblock%}
